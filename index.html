<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rewards Center</title>
    <style>
      body {
        margin: 0;
        background-color: #f8f6f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .task-center-root {
        min-height: 100vh;
        max-width: 480px;
        margin: 0 auto;
        background-color: #f8f6f6;
      }
      .app-boot-main {
        padding: 12px 16px 24px;
      }
      .app-boot-card {
        background: #ffffff;
        border-radius: 16px;
        margin-bottom: 16px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      }
      .app-boot-balance {
        height: 108px;
      }
      .app-boot-block {
        height: 88px;
      }
      .app-boot-block--tall {
        height: 220px;
      }
      @keyframes app-boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.72; }
      }
      .app-boot-skeleton .app-boot-card {
        animation: app-boot-pulse 1.4s ease-in-out infinite;
      }
    </style>
    <script defer src="%BASE_URL%ActivityBridgeHelper.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-skeleton task-center-root" aria-hidden="true">
        <main class="app-boot-main">
          <div class="app-boot-card app-boot-balance"></div>
          <div class="app-boot-card app-boot-block"></div>
          <div class="app-boot-card app-boot-block app-boot-block--tall"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

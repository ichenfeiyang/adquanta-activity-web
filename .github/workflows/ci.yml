name: Pull Request CI

on:
  pull_request:
    branches:
      - master
      - test

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        env:
          VITE_ACTIVITY_API_BASE_URL: https://example.invalid
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test deployment script
        run: python3 -m unittest scripts/deploy_static_test.py
